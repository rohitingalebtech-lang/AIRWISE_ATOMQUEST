{% extends "base.html" %}

{% block title %}404 — Page Not Found | {{ project_name }}{% endblock %}

{% block content %}
<div class="page-container text-center py-5">
    <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <h1 class="empty-title">404 — Page Not Found</h1>
        <p class="empty-desc">
            The requested AirWise URL does not exist or has been relocated.
        </p>
        <div class="empty-action">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
